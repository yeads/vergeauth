name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            compiler: gcc
            build_type: Release
            sanitize: "OFF"
          - name: Clang Release
            compiler: clang
            build_type: Release
            sanitize: "OFF"
          - name: Clang ASan + UBSan
            compiler: clang
            build_type: Debug
            sanitize: "ON"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake pkg-config libevent-dev python3

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DVERGEAUTH_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error
